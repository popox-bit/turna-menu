<title>منو کافه تورنا | Turna Cafe</title>

<style>
:root{--sage:#879c6f;--w:1240px}
*{box-sizing:border-box}
html{background:var(--sage);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sage);min-height:100vh}
.menu{max-width:var(--w);margin:0 auto}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.col{aspect-ratio:297.639/841.89;background:var(--sage);line-height:0;overflow:hidden}
.col svg{display:block;width:100%;height:100%}
.tx text{fill:transparent;cursor:text}
.tx text::selection{background:rgba(0,0,0,.18)}
@media (max-width:879px){
  .menu{max-width:560px;display:flex;flex-direction:column}
  .sheet{display:contents}
  .sheet.s2 .col{order:-1}
}
@media print{
  @page{size:A3 landscape;margin:0}
  html,body{background:var(--sage);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .menu{max-width:none}
  .sheet{break-after:page;break-inside:avoid}
}


/* Editable menu overlay */
.turna-edit-overlay{pointer-events:none}
</style>

(function () {
  "use strict";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";
  const EN_DIGITS = "0123456789";

  function toFaDigits(value) {
    return String(value ?? "").replace(/[0-9]/g, d => FA_DIGITS[EN_DIGITS.indexOf(d)]);
  }

  function normalizePrice(value) {
    if (value === null || value === undefined || value === "") return null;
    const cleaned = String(value)
      .replace(/[,\s]/g, "")
      .replace(/[۰-۹]/g, d => EN_DIGITS[FA_DIGITS.indexOf(d)]);
    if (!/^\d+$/.test(cleaned)) return null;
    return Number(cleaned);
  }

  function scaledTextLength(originalLength, originalText, newText) {
    if (!originalLength) return 100;
    const oldChars = Math.max(1, String(originalText || "").replace(/\s/g, "").length);
    const newChars = Math.max(1, String(newText || "").replace(/\s/g, "").length);
    return Math.max(12, Math.min(185, originalLength * newChars / oldChars));
  }

  function makeText(attrs, value) {
    const el = document.createElementNS(SVG_NS, "text");
    Object.entries(attrs).forEach(([key, val]) => {
      if (val !== null && val !== undefined) el.setAttribute(key, String(val));
    });
    el.textContent = value;
    return el;
  }

  function getViewBoxX(svg) {
    const parts = (svg.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
    return Number.isFinite(parts[0]) ? parts[0] : 0;
  }

  function drawChangedItem(svg, item, nameNode, priceNode) {
    const viewX = getViewBoxX(svg);
    const group = document.createElementNS(SVG_NS, "g");
    group.setAttribute("class", "turna-edit-overlay");
    group.setAttribute("aria-hidden", "true");

    const y = parseFloat(nameNode.getAttribute("y"));
    const nameX = parseFloat(nameNode.getAttribute("x"));
    const nameLength = parseFloat(nameNode.getAttribute("textLength") || "100");
    const originalDisplay = nameNode.dataset.originalDisplay || nameNode.textContent.trim();
    const merged = nameNode.dataset.menuMerged === "1";

    // سفید کردن همان محدوده‌ای که متن اصلی در آن قرار دارد.
    const mask = document.createElementNS(SVG_NS, "rect");
    mask.setAttribute("x", viewX + 50);
    mask.setAttribute("y", y - 12.5);
    mask.setAttribute("width", 195);
    mask.setAttribute("height", 18);
    mask.setAttribute("fill", "#fff");
    group.appendChild(mask);

    if (item.enabled === false) {
      svg.appendChild(group);
      return;
    }

    const currentName = String(item.name ?? "");
    const currentPrice = normalizePrice(item.price);
    const faPrice = currentPrice === null ? null : toFaDigits(currentPrice);

    const baseTextAttrs = {
      "text-anchor": "end",
      direction: "rtl",
      "unicode-bidi": "plaintext",
      "font-size": 10,
      "font-family": "sans-serif",
      fill: "#000"
    };

    if (merged) {
      const display = faPrice === null ? currentName : `${currentName} ${faPrice}`;
      const width = scaledTextLength(nameLength, originalDisplay, display);
      group.appendChild(makeText({
        ...baseTextAttrs,
        x: viewX + nameX,
        y,
        textLength: width,
        lengthAdjust: "spacingAndGlyphs"
      }, display));
    } else {
      const nameWidth = scaledTextLength(nameLength, nameNode.textContent.trim(), currentName);
      group.appendChild(makeText({
        ...baseTextAttrs,
        x: viewX + nameX,
        y,
        textLength: nameWidth,
        lengthAdjust: "spacingAndGlyphs"
      }, currentName));

      if (faPrice !== null) {
        let priceX;
        let priceY;
        let priceLength;
        let originalPrice;

        if (priceNode) {
          priceX = parseFloat(priceNode.getAttribute("x"));
          priceY = parseFloat(priceNode.getAttribute("y"));
          priceLength = parseFloat(priceNode.getAttribute("textLength") || "20");
          originalPrice = priceNode.getAttribute("data-original-price") || priceNode.textContent.trim();
        } else {
          priceX = parseFloat(nameNode.dataset.mergedPriceX || "91");
          priceY = y;
          priceLength = parseFloat(nameNode.dataset.mergedPriceLength || "21");
          originalPrice = faPrice;
        }

        const width = scaledTextLength(priceLength, originalPrice, faPrice);
        group.appendChild(makeText({
          ...baseTextAttrs,
          x: viewX + priceX,
          y: priceY,
          textLength: width,
          lengthAdjust: "spacingAndGlyphs"
        }, faPrice));
      }
    }

    svg.appendChild(group);
  }

  function initTurnaEditor() {
    document.querySelectorAll("svg").forEach(svg => {
      svg.querySelectorAll("[data-menu-id][data-menu-role='name']").forEach(nameNode => {
        const id = nameNode.getAttribute("data-menu-id");
        const item = MENU_CONFIG[id];
        if (!item) return;

        const priceNode = svg.querySelector(
          `[data-menu-id="${CSS.escape(id)}"][data-menu-role="price"]`
        );

        const originalName = nameNode.dataset.menuMerged === "1"
          ? String(nameNode.dataset.originalDisplay || "").replace(/\s*[۰-۹0-9]{3,}\s*$/, "").trim()
          : nameNode.textContent.trim();

        const originalPrice = priceNode
          ? normalizePrice(priceNode.getAttribute("data-original-price") || priceNode.textContent.trim())
          : (nameNode.dataset.menuMerged === "1"
              ? normalizePrice((nameNode.dataset.originalDisplay || "").match(/[۰-۹0-9]{3,}$/)?.[0])
              : null);

        const currentName = String(item.name ?? "");
        const currentPrice = normalizePrice(item.price);

        const changed =
          item.enabled === false ||
          currentName !== originalName ||
          currentPrice !== originalPrice;

        if (changed) drawChangedItem(svg, item, nameNode, priceNode);
      });
    });
  }

  window.addEventListener("DOMContentLoaded", initTurnaEditor);
})();
</script>
